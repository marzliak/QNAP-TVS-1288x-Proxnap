# Proxnap USB Copy button update policy.

enabled=false
button_input=/dev/input/by-path/platform-qnap8528-event
# qnap8528 maps the front USB Copy button to BTN_2 (0x102).
button_code=0x102
check_hold_seconds=2
upgrade_hold_seconds=0
upgrade_click_count=5
upgrade_click_window_seconds=5
reboot_click_count=10
poweroff_click_count=15
upgrade_click_min=4
upgrade_click_max=7
reboot_click_min=8
poweroff_click_min=13
click_sequence_window_seconds=8
click_sequence_settle_seconds=2.0
confirm_click_count=3
confirm_window_seconds=5
debounce_seconds=0.03
lock_file=/run/lock/proxnap-action.lock
running_flag=/run/proxnap-update-running
log_file=/var/log/proxnap-copy-update.log

lcd_enabled=true
lcd_port=/dev/ttyS1
lcd_message_seconds=8
lcd_off_after_message=false
lcd_lock_file=/run/proxnap-lcd-message.lock
lcd_restore_service=proxnap-lcd.service

# Hold for check refreshes apt metadata and logs the update count.
short_refresh_enabled=false

# Nominal UX: five clicks update, ten clicks reboot, fifteen clicks poweroff.
# The physical Copy button/driver can miss fast clicks, so the daemon maps
# ranges defensively:
#   4-7 clicks: arm update
#   8-12 clicks: arm reboot
#   13+ clicks: arm poweroff
# Every action needs three confirmation clicks while the LCD prompt is visible.
upgrade_enabled=false
upgrade_command=apt-get -y -o Dpkg::Options::=--force-confold dist-upgrade
refresh_command=apt-get update

# All final effects require independent explicit opt-ins.
reboot_enabled=false
poweroff_enabled=false
