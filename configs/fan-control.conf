# Proxnap fan control policy.
#
# Hardware mapping on QNAP TVS-1288X via qnap8528:
#   cpu group:  fan7/fan8, pwm7
#   rear group: fan1/fan2/fan3, pwm1
#
# Curves are temperature C : duty percent 0..100. Values between points are
# linearly interpolated. If a sensor disappears, the daemon fails safe at 100%.

enabled=true
mode=auto
# Control loop cadence. Keep both zones at their lowest stable continuous duty
# during normal operation; the curves retain thermal protection above the
# documented thresholds.
interval_seconds=5
# Written on stop/restart; 100% is the temporary fail-safe, not the normal profile.
stop_duty=100

# Smoothing may hold cooling longer, never suppress a raw-temperature requirement.
# Thermal increases are immediate; interval/step controls apply to descent only.
cpu_temp_ema_alpha=0.25
rear_temp_ema_alpha=0.20
cpu_temp_average_seconds=30
rear_temp_average_seconds=120
duty_hysteresis=6
min_increase_interval=0
min_decrease_interval=25
cpu_min_increase_interval=0
cpu_min_decrease_interval=30
rear_min_increase_interval=0
rear_min_decrease_interval=120
cpu_max_duty_step=5
rear_max_duty_step=8
cpu_emergency_temp=92
rear_emergency_temp=65

# mode:
#   auto   = custom values below if present, otherwise normal profile
#   quiet  = lower acoustic profile, still fails safe at critical temps
#   normal = balanced default
#   extra  = more aggressive cooling
#   full   = fixed 100% duty on CPU and rear groups

cpu_pwm=pwm7
cpu_sensor_policy=cpu_package
cpu_min_duty=50
cpu_max_duty=100
cpu_critical_temp=92
cpu_manual_duty=
# Preserve the existing continuous floor; gain cooling margin before emergency.
# This is not a physically calibrated PWM-to-RPM curve.
cpu_curve=0:50,65:50,70:55,75:65,80:80,85:90,90:100

rear_pwm=pwm1
# Retain the existing drivetemp policy; it is not proof that every such sensor
# is a mechanical HDD or that rear airflow has no effect on CPU cooling.
# Do not add NVMe polling or new EC temperature traffic in this correction.
rear_sensor_policy=hdd
# The TVS-1288X rear fans are not stable below roughly 30%; use 40% as the
# lowest continuous duty validated without start/stop cycling.
rear_min_duty=40
rear_max_duty=100
rear_critical_temp=70
rear_manual_duty=
# Disk-targeted emergency ramp.
rear_curve=0:40,55:40,60:55,63:75,65:100

# Avoid extra tachometer polling; the physical pulse cause is still unresolved.
log_fan_rpm=false

# Retain the current refresh cadence; no manual-mode lease or autonomous
# thermal-override threshold has been established. Readback confirms only the
# quantized duty, not controller ownership or physical response. No CPU caps.
pwm_refresh_seconds=60
