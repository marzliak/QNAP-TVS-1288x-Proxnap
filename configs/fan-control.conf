# TVS-1288X mapping is fixed in code: pwm7=CPU, pwm1=rear chassis fans.
interval_seconds=5
duty_hysteresis=4
stall_cycles=3

cpu_sensor_policy=cpu_package
cpu_min_duty=50
cpu_critical_temp=92
cpu_curve=0:50,85:50,88:65,90:80,92:100

# storage considers SATA drive, chipset, memory and qnap8528 system sensors.
# Use hdd only after validating that all populated bays expose drivetemp.
rear_sensor_policy=storage
rear_min_duty=40
rear_critical_temp=70
rear_curve=0:40,55:40,60:55,63:75,65:100
