# Proxnap LCD policy.

enabled=true
page_seconds=8
home_frame_seconds=7
home_tick_seconds=0.5
heartbeat_enabled=true
timeout_seconds=300
config_reload_seconds=30
data_refresh_seconds=15

# auto: prefer bond*, then vmbr0, then first visible active interface.
# Can also be a comma-separated list such as bond0,vmbr0.
primary_net=auto

# Interface pages are dynamic. These prefixes are hidden by default.
interface_exclude_prefixes=lo,tap,veth,fwbr,fwln,fwpr,docker,br-

# auto: include child datasets only. Or set comma-separated prefixes:
# dataset_include=zpool1/,zpool2/nas,zpool4/
dataset_include=auto
dataset_warn_percent=85

# Services page. Keep storage-sharing daemons out until they are deliberately
# enabled, otherwise the LCD reports false warnings on a fresh Proxmox install.
services=pveproxy,pvedaemon,pvestatd

# Optional qnap8528 input fallback. Keep empty for now because the EC input
# carries chassis/copy/reset buttons, not confirmed LCD navigation buttons.
button_input=

# Optional information-only KEY_POWER popup in the existing LCD daemon.
# Explicit absolute Power Button evdev paths/aliases, comma-separated; no scan.
# Supply locally verified /dev/input/by-path aliases, not the qnap8528 input.
# This does NOT enable the legacy power-button listener or any power action.
power_status_enabled=false
power_status_inputs=
# Finite 1..10 seconds per page; invalid values fall back to 3.0.
power_status_page_seconds=3.0

# Optional readable automatic presentation for either status popup. Off preserves
# the legacy pager exactly. This does not enable Copy/Power or authorize actions.
status_scroll_enabled=false
# Finite values clamp to 0.6..2, 1..5, and 10..60 seconds; invalid uses defaults.
status_scroll_step_seconds=0.6
status_scroll_pause_seconds=1.5
status_scroll_max_seconds=60
# Optional private human labels keyed by the EXACT full systemd unit ID.
# Example only; no whitespace in the key or before '='. No recovery claim implied.
# status_label.example-prepare.service=Falha ao preparar o driver

# Optional isolated Copy click popup; no second Copy input reader or service.
# Match status_socket in the existing Copy listener; abstract Linux socket only.
copy_status_enabled=false
copy_status_socket=@proxnap-lcd-status

# Update-menu callbacks only: match the Copy listener's actual --config path.
# Reboot/Shutdown callbacks deliberately keep their existing default config.
copy_update_config=/etc/proxnap/copy-button.conf

# Shared lock used by Copy/update/action messages so the LCD daemon does not
# write over a temporary external prompt.
lcd_message_lock=/run/proxnap-lcd-message.lock
