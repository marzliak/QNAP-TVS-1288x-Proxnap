# Proxnap physical power button policy.
#
# Short press is ignored. Deliberate click sequences arm an action, then require
# a second confirmation sequence.

enabled=false
input_paths=/dev/input/by-path/platform-PNP0C0C:00-event,/dev/input/by-path/platform-LNXPWRBN:00-event
reboot_click_count=5
poweroff_click_count=10
sequence_window_seconds=3
sequence_settle_seconds=0.6
confirm_click_count=3
confirm_window_seconds=3
debounce_seconds=0.15
lock_file=/run/lock/proxnap-action.lock
log_file=/var/log/proxnap-power-button.log

lcd_enabled=true
lcd_port=/dev/ttyS1
lcd_lock_file=/run/proxnap-lcd-message.lock

reboot_enabled=false
poweroff_enabled=false
