[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qnap-tvs-1288x-proxnap"
version = "0.1.0"
description = "Safe Proxmox hardware control for the QNAP TVS-1288X"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Proxnap contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.16,<1"]

[project.scripts]
proxnap-fan-control = "proxnap.runtime:fan_main"
proxnap-lcd = "proxnap.runtime:lcd_main"
proxnap-status-led = "proxnap.runtime:status_main"
proxnap-panel-led = "proxnap.runtime:panel_main"
proxnap-disk-leds = "proxnap.runtime:disk_main"
proxnap-buttons = "proxnap.buttons:main"
proxnap-copy-update = "proxnap.runtime:copy_main"
proxnap-power-button = "proxnap.runtime:power_main"
proxnap-metrics = "proxnap.runtime:metrics_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
src = ["src"]

# Explicit project rules avoid inheriting unrelated parent-workspace policies.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
